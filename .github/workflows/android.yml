name: Build APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes do motor de cálculo
        run: npm test

      - name: Build web
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar projeto Android (Capacitor)
        run: |
          npx cap add android
          node scripts/assets.mjs --android
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calculadora-campo-${{ github.ref_name == 'main' && 'dev' || github.ref_name }}.apk
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-campo-apk
          path: calculadora-campo-*.apk

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: calculadora-campo-*.apk
